name = "soulsilent"
# Custom wrapper around the OpenNext worker — adds the `scheduled` handler the
# generated `.open-next/worker.js` lacks (it delegates `fetch` back to it).
# Required for the Cron Trigger below to do anything.
main = "worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Runs every minute: pings /api/cron/expire-holds (guarded by CRON_SECRET) to
# release the seat of any hold past its 10-min window and retry the refund of
# money that arrived after it. A PromptPay QR cannot be cancelled, so a late
# scan is money to give back rather than something to block.
[triggers]
crons = ["* * * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "soulsilent"
database_id = "78ed04be-4e8e-4b38-864d-dd899c987106"

[[r2_buckets]]
binding = "R2"
bucket_name = "soulsilent-media"

# Custom domains — bound on deploy (zone must be Active on this Cloudflare
# account). Provisions the hostname + universal SSL cert automatically.
[[routes]]
pattern = "allsoullearn.com"
custom_domain = true

[[routes]]
pattern = "www.allsoullearn.com"
custom_domain = true

# Non-secret vars only. Secrets are managed via `wrangler secret put`:
#   - JWT_SECRET            (set as secret)
#   - GOOGLE_CLIENT_SECRET  (wrangler secret put GOOGLE_CLIENT_SECRET)
#   - RESEND_API_KEY        (wrangler secret put RESEND_API_KEY)
#
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are no longer read by anything and
# can be deleted with `wrangler secret delete`.
#
# Beam — BOTH must be set before the first deploy that serves payments, or every
# booking fails with "Beam is not configured":
#   - BEAM_API_KEY          (wrangler secret put BEAM_API_KEY)
#   - BEAM_WEBHOOK_SECRET   (wrangler secret put BEAM_WEBHOOK_SECRET) — the
#     signing key of the webhook endpoint registered for THIS site. Production
#     and preview are separate endpoints with separate keys; a booking confirmed
#     by the wrong key is a booking never confirmed at all.
#   - FINANCE_EXPORT_KEY    (wrangler secret put FINANCE_EXPORT_KEY) — read-only
#                           finance export /api/export/finance; long random string
[vars]
GOOGLE_CLIENT_ID = "798833181382-0sf30qcflhmpo6sepoke9i8ojab71fbp.apps.googleusercontent.com"
SITE_URL = "https://allsoullearn.com"
# Beam merchant identifier — not a secret (the API key and the webhook HMAC key
# are). Production and preview share one LIVE Beam account, so events for both
# sites arrive at both endpoints; SITE_URL above is what tells them apart.
BEAM_MERCHANT_ID = "allsoullearn-vg1ez5"
# Verified Resend "from" address (allsoullearn.com verified 2026-08-03).
EMAIL_FROM = "soulsilent <noreply@allsoullearn.com>"
