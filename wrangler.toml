name = "soulsilent"
# Custom wrapper around the OpenNext worker — adds the `scheduled` handler the
# generated `.open-next/worker.js` lacks (it delegates `fetch` back to it).
# Required for the Cron Trigger below to do anything.
main = "worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Runs every minute: pings /api/cron/expire-holds (guarded by CRON_SECRET) to
# cancel the Stripe session/PaymentIntent of any hold past its 10-min window,
# voiding a saved PromptPay QR at minute 10 instead of waiting for Stripe's
# 30-min session auto-expiry.
[triggers]
crons = ["* * * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "soulsilent"
database_id = "78ed04be-4e8e-4b38-864d-dd899c987106"

[[r2_buckets]]
binding = "R2"
bucket_name = "soulsilent-media"

# Custom domains — bound on deploy (zone must be Active on this Cloudflare
# account). Provisions the hostname + universal SSL cert automatically.
[[routes]]
pattern = "allsoullearn.com"
custom_domain = true

[[routes]]
pattern = "www.allsoullearn.com"
custom_domain = true

# Non-secret vars only. Secrets are managed via `wrangler secret put`:
#   - JWT_SECRET            (set as secret)
#   - STRIPE_SECRET_KEY     (set as secret)
# Still pending (set when ready):
#   - STRIPE_WEBHOOK_SECRET (wrangler secret put STRIPE_WEBHOOK_SECRET)
#   - GOOGLE_CLIENT_SECRET  (wrangler secret put GOOGLE_CLIENT_SECRET)
#   - RESEND_API_KEY        (wrangler secret put RESEND_API_KEY)
[vars]
GOOGLE_CLIENT_ID = "798833181382-0sf30qcflhmpo6sepoke9i8ojab71fbp.apps.googleusercontent.com"
SITE_URL = "https://allsoullearn.com"
# Verified Resend "from" address (allsoullearn.com verified 2026-08-03).
EMAIL_FROM = "soulsilent <noreply@allsoullearn.com>"
